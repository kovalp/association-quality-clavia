<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classification via instrumented association (ClavIA).</title>
    <style>
        /* Basic Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        #container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h2 {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        span {
            font-size: 1.5rem;
        }

        #next-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #0f0;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .main-grid {
            display: grid;
            /* '1fr 1fr' makes both columns exactly 50% wide, ignoring content */
            grid-template-columns: 1fr 1fr;
            column-gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: max-content 0.7fr;
            column-gap: 10px;
            row-gap: 5px;
            align-items: baseline;
        }
        .form-grid > div:nth-child(odd) {
            text-align: right;
        }
        .conf-mat-grid {
            width: fit-content;
            margin-top: 10px;
            justify-content: center;
            display: grid;
            grid-template-columns: max-content max-content;
            gap: 1px;
            background-color: black;
        }
        .conf-mat-grid span {
            background-color: white;
            padding: 10px 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="container">
    <div class="main-grid">
        <div>
            <h2>Input</h2>
            <div class="form-grid">
                <div>annotation ID:</div>
                <span id="ann">1</span>
                <div>update ID:</div>
                <span id="upd">1</span>
                <div>supply:</div>
                <span id="supply">yes</span>
            </div>
        </div>
        <div>
            <h2>Output</h2>
            <div><span id="outcome">TP</span></div>
        </div>
    </div>
    <div>
        <input type="button" id="next-btn" value="Next">
    </div>
    <div class="main-grid">
        <div>Confusion matrix</div>
        <div>Ratios</div>
        <div class="form-grid">
            <div># TP</div><span id="cm-tp">1</span>
            <div># FP</div><span id="cm-fp">0</span>
            <div># FN</div><span id="cm-fn">0</span>
            <div># TN</div><span id="cm-tn">0</span>
        </div>
        <div class="form-grid">
            <div>Accuracy</div><span id="ratios-accuracy">1</span>
            <div>Recall</div><span id="ratios-recall">1</span>
            <div>Precision</div><span id="ratios-precision">0</span>
            <div>F1</div> <span id="ratios-f1">0</span>
        </div>
    </div>
</div>

<script>
    const ids = [0, 1, -1, -9999];
    const nextButton = document.getElementById('next-btn');
    const ann_span = document.getElementById('ann');
    const upd_span = document.getElementById('upd');
    const supply_span = document.getElementById('supply');
    const outcome_span = document.getElementById('outcome');
    const cm_tp = document.getElementById('cm-tp');
    const cm_fp = document.getElementById('cm-fp');
    const cm_fn = document.getElementById('cm-fn');
    const cm_tn = document.getElementById('cm-tn');
    const ratios_accuracy = document.getElementById('ratios-accuracy');
    const ratios_recall = document.getElementById('ratios-recall');
    const ratios_precision = document.getElementById('ratios-precision');
    const ratios_f1 = document.getElementById('ratios-f1');

    const UPD_ID_LOOSE = -9999;

    function get_random_id(len) {
        const randomIndex = Math.floor(Math.random() * len);
        return ids[randomIndex];
    }

    const BinClass = {
        TP: 'TP',
        FP: 'FP',
        FN: 'FN',
        TN: 'TN'
    };

    const OutcomeColors = {
        TP: "#00f",
        FP: "#f0a",
        FN: "#f0f",
        TN: '#0af',
        error: "#666"
    };

    class Classifier {
        constructor() {
            this.num_tp = 0;
            this.num_fn = 0;
            this.num_fp = 0;
            this.num_tn = 0;
        }

        /**
         * Classify and accumulate the results of an association.
         *
         * @param {number} ann_id - The annotation ID from the instrumented target.
         * @param {number} upd_id - The update ID from the instrumented target.
         * @param {boolean} is_supplied - Indicates if the detection was supplied to tracker.
         * @returns {string} The BinClass enumerable value.
         */
        classify(ann_id, upd_id, is_supplied) {
            if (ann_id >= 0 && is_supplied) {
                if (ann_id === upd_id) {
                    this.num_tp += 1;
                    return BinClass.TP;
                } else if (upd_id >= 0) {
                    this.num_fn += 1;
                    return BinClass.FN;
                } else if (upd_id === -1) {
                    this.num_fn += 1;
                    return BinClass.FN;
                } else if (upd_id === UPD_ID_LOOSE) {
                    this.num_fn += 1;
                    return BinClass.FN;
                } else {
                    return "error";
                }
            } else if (ann_id >= 0 && !is_supplied) {
                if (ann_id === upd_id) {
                    return "error";
                } else if (upd_id >= 0) {
                    this.num_fp += 1;
                    return BinClass.FP;
                } else if (upd_id === -1) {
                    this.num_fp += 1;
                    return BinClass.FP;
                } else if (upd_id === UPD_ID_LOOSE) {
                    this.num_tn += 1;
                    return BinClass.TN;
                } else {
                    return "error";
                }
            } else if (ann_id === -1) {
                if (ann_id === upd_id) {
                    this.num_tn += 1;
                    return BinClass.TN;
                } else if (upd_id >= 0) {
                    this.num_fp += 1;
                    return BinClass.FP;
                } else if (upd_id === UPD_ID_LOOSE) {
                    this.num_tn += 1;
                    return BinClass.TN;
                } else {
                    return "error";
                }
            } else {
                return "error";
            }
        }
        get_color(outcome) {
            return OutcomeColors[outcome];
        }
        get_accuracy() {
            return (this.num_tp + this.num_tn) / (this.num_fp + this.num_fn + this.num_tp + this.num_tn);
        }
    }

    let classifier = new Classifier();

    function handleNextClick() {
        const ann_id = get_random_id(3);
        const upd_id = get_random_id(4);
        const supply = get_random_id(2) === 1;
        ann_span.textContent = ann_id.toString();
        upd_span.textContent = upd_id.toString();
        supply_span.textContent = supply ? "yes" : "no";
        let outcome = classifier.classify(ann_id, upd_id, supply);
        outcome_span.textContent = outcome.toString();
        outcome_span.style.color = classifier.get_color(outcome);
        cm_tp.textContent = classifier.num_tp.toString()
        cm_fp.textContent = classifier.num_fp.toString()
        cm_fn.textContent = classifier.num_fn.toString()
        cm_tn.textContent = classifier.num_tn.toString();
        ratios_accuracy.textContent = classifier.get_accuracy().toFixed(6);

    }

    nextButton.addEventListener('click', handleNextClick);
    let outcome = classifier.classify(1, 1, true)
    outcome_span.style.color = classifier.get_color(outcome);
    cm_tp.textContent = classifier.num_tp.toString()
    cm_fp.textContent = classifier.num_fp.toString()
    cm_fn.textContent = classifier.num_fn.toString()
    cm_tn.textContent = classifier.num_tn.toString();
    ratios_accuracy.textContent = classifier.get_accuracy().toFixed(6);

</script>

</body>
</html>
