<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classification via instrumented association (ClavIA).</title>
    <style>
        /* Basic Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        #container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }
        span {
            font-size: 1.5rem;
        }
        .tp-color {
            color: #00f;
        }
        .fp-color {
            color: #f0a;
        }
        .fn-color {
            color: #f0f;
        }
        .tn-color {
            color: #0af;
        }
        .tooltip-container {
            position: relative;
            display: inline-block;
            cursor: help;
        }
        .tooltip-text {
            visibility: hidden;
            background-color: black;
            color: white;
            text-align: center;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            white-space: nowrap;
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        #next-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #0f0;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        #next-btn:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 10px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: max-content 0.7fr;
            column-gap: 10px;
            row-gap: 5px;
            align-items: baseline;
        }
        .form-grid > div:nth-child(odd) {
            text-align: right;
        }
    </style>
</head>
<body>

<div id="container">
    <div class="main-grid">
        <div>
            <h2>Input</h2>
            <div class="form-grid">
                <div title="Detection ID at target creation time.">annotation ID:</div>
                <span id="ann">1</span>
                <div title="Detection ID if associated or -9999 (unmatch flag) if not associated.">update ID:</div>
                <span id="upd">1</span>
                <div title="Whether the annotation ID is present among detections.">supply:</div>
                <span id="supply">yes</span>
            </div>
            </div>
            <div>
                <h2>Output</h2>
                <div title="Binary class of the association outcome."><span id="outcome">TP</span></div>
            </div>
        </div>
    <div>
        <input type="button" id="next-btn" value="Next" title="Random choice of annotation ID, update IDs and supply.">
    </div>
    <div style="margin-bottom: 20px"></div>
    <div class="main-grid">

        <div title="Number of TPs, FNs, FNs and TNs seen so far.">Confusion matrix</div>
        <div style="margin-bottom: 15px">Ratios</div>

        <div class="form-grid">
            <div title="Number of true positives." class="tp-color"># TP</div><span id="cm-tp" class="tp-color">1</span>
            <div title="Number of false positives." class="fp-color"># FP</div><span id="cm-fp" class="fp-color">0</span>
            <div title="Number of false negatives." class="fn-color"># FN</div><span id="cm-fn" class="fn-color">0</span>
            <div title="Number of true negatives." class="tn-color"># TN</div><span id="cm-tn" class="tn-color">0</span>
        </div>
        <div class="form-grid">
            <div title="A = (TP + TN) / (TP + TN + FP + FN)">Accuracy</div><span id="ratios-accuracy">1</span>
            <div title="R = TP / (TP + FN)">Recall</div><span id="ratios-recall">1</span>
            <div title="P = TP / (TP + FP)">Precision</div><span id="ratios-precision">0</span>
            <div title="F1=sqrt(R P)">F1</div> <span id="ratios-f1">0</span>
        </div>
    </div>
</div>

<script>
    const ids = [0, 1, 0, 0, -1, -9999];
    const nextButton = document.getElementById('next-btn');
    const UPD_ID_LOOSE = -9999;

    function get_random_id(len) {
        return ids[Math.floor(Math.random() * len)];
    }

    const BinClass = {
        TP: 'TP',
        FP: 'FP',
        FN: 'FN',
        TN: 'TN'
    };

    const OutcomeColors = {
        TP: "#00f",
        FP: "#f0a",
        FN: "#f0f",
        TN: '#0af',
        error: "#666"
    };

    class Classifier {
        constructor() {
            this.num_tp = 0;
            this.num_fn = 0;
            this.num_fp = 0;
            this.num_tn = 0;
        }

        /**
         * Classify and accumulate the results of an association.
         *
         * @param {number} ann_id - The annotation ID from the instrumented target.
         * @param {number} upd_id - The update ID from the instrumented target.
         * @param {boolean} is_supplied - Indicates if the detection was supplied to tracker.
         * @returns {string} The BinClass enumerable value.
         */
        classify(ann_id, upd_id, is_supplied) {
            if (ann_id >= 0 && is_supplied) {
                if (ann_id === upd_id) {
                    this.num_tp += 1;
                    return BinClass.TP;
                } else if (upd_id >= 0) {
                    this.num_fn += 1;
                    return BinClass.FN;
                } else if (upd_id === -1) {
                    this.num_fn += 1;
                    return BinClass.FN;
                } else if (upd_id === UPD_ID_LOOSE) {
                    this.num_fn += 1;
                    return BinClass.FN;
                } else {
                    return "error";
                }
            } else if (ann_id >= 0 && !is_supplied) {
                if (ann_id === upd_id) {
                    return "error";
                } else if (upd_id >= 0) {
                    this.num_fp += 1;
                    return BinClass.FP;
                } else if (upd_id === -1) {
                    this.num_fp += 1;
                    return BinClass.FP;
                } else if (upd_id === UPD_ID_LOOSE) {
                    this.num_tn += 1;
                    return BinClass.TN;
                } else {
                    return "error";
                }
            } else if (ann_id === -1) {
                if (ann_id === upd_id) {
                    this.num_tn += 1;
                    return BinClass.TN;
                } else if (upd_id >= 0) {
                    this.num_fp += 1;
                    return BinClass.FP;
                } else if (upd_id === UPD_ID_LOOSE) {
                    this.num_tn += 1;
                    return BinClass.TN;
                } else {
                    return "error";
                }
            } else {
                return "error";
            }
        }
        get_accuracy() {
            return (this.num_tp + this.num_tn) / (this.num_fp + this.num_fn + this.num_tp + this.num_tn);
        }

        get_recall() {
            return this.num_tp / (this.num_tp + this.num_fn);
        }
        get_precision() {
            return this.num_tp / (this.num_tp + this.num_fp);
        }
        get_f1() {
            return Math.sqrt(this.get_recall() * this.get_precision());
        }
    }

        class Frontend{
        constructor() {
            this.ann_span = document.getElementById('ann');
            this.upd_span = document.getElementById('upd');
            this.supply_span = document.getElementById('supply');
            this.outcome_span = document.getElementById('outcome');
            this.cm_tp = document.getElementById('cm-tp');
            this.cm_fp = document.getElementById('cm-fp');
            this.cm_fn = document.getElementById('cm-fn');
            this.cm_tn = document.getElementById('cm-tn');
            this.ratios_accuracy = document.getElementById('ratios-accuracy');
            this.ratios_recall = document.getElementById('ratios-recall');
            this.ratios_precision = document.getElementById('ratios-precision');
            this.ratios_f1 = document.getElementById('ratios-f1');
        }

        update(classifier, ann_id, upd_id, supply) {
            this.ann_span.textContent = ann_id.toString();
            this.upd_span.textContent = upd_id.toString();
            this.supply_span.textContent = supply ? "yes" : "no";
            const outcome = classifier.classify(ann_id, upd_id, supply);
            this.outcome_span.textContent = outcome.toString();
            this.outcome_span.style.color = OutcomeColors[outcome];
            this.cm_tp.textContent = classifier.num_tp.toString()
            this.cm_fp.textContent = classifier.num_fp.toString()
            this.cm_fn.textContent = classifier.num_fn.toString()
            this.cm_tn.textContent = classifier.num_tn.toString();
            this.ratios_accuracy.textContent = classifier.get_accuracy().toFixed(6);
            this.ratios_recall.textContent = classifier.get_recall().toFixed(4);
            this.ratios_precision.textContent = classifier.get_precision().toFixed(4);
            this.ratios_f1.textContent = classifier.get_f1().toFixed(4);
        }
    }

    let classifier = new Classifier();
    let front = new Frontend();

    function handleNextClick() {
        const ann_id = get_random_id(5);
        const upd_id = get_random_id(6);
        const supply = get_random_id(2) === 1;
        front.update(classifier, ann_id, upd_id, supply);
    }

    nextButton.addEventListener('click', handleNextClick);
    front.update(classifier, 1, 1, true);
</script>

</body>
</html>
